name: Idea or feature request
description: Make sys1 more powerful, safer, or easier
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or goal, not just the solution.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: How could sys1 help?
  - type: textarea
    id: safety
    attributes:
      label: Safety
      description: Could this be misused, or affect machine owners? How might we keep it safe?
