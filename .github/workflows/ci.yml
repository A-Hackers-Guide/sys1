name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (race detector)
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build every target
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          for t in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 \
                   linux/amd64 linux/arm64 linux/arm linux/386 linux/riscv64 linux/ppc64le linux/s390x linux/mips64le \
                   freebsd/amd64 freebsd/arm64 openbsd/amd64 netbsd/amd64 dragonfly/amd64 \
                   solaris/amd64 illumos/amd64 aix/ppc64 android/arm64; do
            echo "::group::$t"
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/sys0
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/sys1
            echo "::endgroup::"
          done

  goreleaser-check:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
