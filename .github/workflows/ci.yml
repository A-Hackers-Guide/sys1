name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (race detector)
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Real release signatures (Sigstore)
        if: runner.os == 'Linux'
        run: SYS1_NETWORK_TESTS=1 go test -count=1 -run TestVerifyARealRelease -v ./internal/update

  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build every target
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          for t in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 \
                   linux/amd64 linux/arm64 linux/arm linux/386 linux/riscv64 linux/ppc64le linux/s390x linux/mips64le \
                   freebsd/amd64 freebsd/arm64 openbsd/amd64 netbsd/amd64 dragonfly/amd64 \
                   solaris/amd64 illumos/amd64 aix/ppc64 android/arm64; do
            echo "::group::$t"
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/sys0
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/sys1
            echo "::endgroup::"
          done

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the image the way GoReleaser lays it out
        run: |
          mkdir -p ctx/linux/amd64
          CGO_ENABLED=0 go build -o ctx/linux/amd64/sys0 ./cmd/sys0
          CGO_ENABLED=0 go build -o ctx/linux/amd64/sys1 ./cmd/sys1
          docker build --platform linux/amd64 -f packaging/docker/Dockerfile -t sys1:test ctx
      - name: Sandbox for shared machines, against real Docker
        run: |
          docker tag sys1:test sys1-gateway:test
          SYS1_DOCKER_TESTS=1 SYS1_GATEWAY_IMAGE=sys1-gateway:test go test -count=1 -v -run 'TestSandbox' ./internal/agent
      - name: Run it and check the node answers
        run: |
          docker run -d --name sys1 -p 7443:7443 -p 127.0.0.1:7700:7700 sys1:test
          for i in $(seq 1 30); do curl -skf https://127.0.0.1:7443/healthz && break; sleep 1; done
          curl -skf https://127.0.0.1:7443/healthz | grep -qx ok
          curl -sf -o /dev/null http://127.0.0.1:7700/
          docker exec sys1 sys1 open | grep -q "Dashboard: http://127.0.0.1:7700/?key="
          docker exec sys1 sys1 join-code | grep -q "^sys1-join:"
          docker logs sys1 2>&1 | tail -5

  vm:
    name: Virtual machine boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install QEMU and allow KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; echo "KVM available"; else echo "no KVM: software emulation"; fi
      - name: Boot a VM through sys0
        run: SYS1_QEMU_TESTS=1 go test -count=1 -v -run 'TestVMBoots|TestCloudInit' ./internal/agent

  goreleaser-check:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  intake:
    name: Crash intake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test intake/
